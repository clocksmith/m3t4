<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m3t4 — arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2270%22>&#9876;</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="topnav">
    <div class="brand">
      <a href="#intro" class="logo">m3t4<span class="logo-caret">.ai</span></a>
    </div>
    <nav>
      <a href="#intro" data-route="intro">start</a>
      <a href="#build" data-route="build">tune</a>
      <a href="#spectate" data-route="spectate">live</a>
      <a href="#profile" data-route="profile">roster</a>
      <a href="#duel" data-route="duel" data-feature="p2pDuel" hidden>duel</a>
      <a href="#about" data-route="about">about</a>
    </nav>
    <div id="whoami" class="whoami"></div>
  </header>

  <main id="app"></main>

  <footer id="bottom">
    <span id="status">—</span>
    <span class="spacer"></span>
    <a href="https://github.com/m3t4-ai" target="_blank" rel="noreferrer">github</a>
  </footer>

  <script src="config.js"></script>
  <script>
    if (!window.__M3T4_API_ORIGIN__ && !["localhost", "127.0.0.1"].includes(location.hostname)) {
      window.__M3T4_API_ORIGIN__ = "https://api.m3t4.ai";
    }
    if (!window.__M3T4_AUTH_MODE__) {
      window.__M3T4_AUTH_MODE__ = ["localhost", "127.0.0.1"].includes(location.hostname) ? "dev" : "firebase";
    }
  </script>
  <script type="module">
    import { installAlphaGate } from "./lib/alpha-gate.js";
    await installAlphaGate();
    await import("./app.js");
  </script>
</body>
</html>
