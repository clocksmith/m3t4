<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040404">
  <meta name="description" content="Meta Duel parody tech titan combat arena.">
  <title>m3t4.ai</title>
  <link rel="icon" href="/home-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <main>
    <header class="home-header">
      <h1>m3t4<span>.ai</span></h1>
    </header>

    <section class="duel-featured-card" aria-label="Featured Game: Meta Duel">
      <div class="duel-heading">
        <h2>Meta Duel</h2>
      </div>

      <div class="roster-grid" role="list" aria-label="Titan Roster">
        <a href="/roster" class="roster-card" role="listitem" title="Sama — Capacity Mystic">
          <div class="roster-avatar roster-avatar-sama" aria-hidden="true"></div>
          <span class="roster-name">Sama</span>
          <span class="roster-role">Capacity Mystic</span>
        </a>
        <a href="/roster" class="roster-card" role="listitem" title="Dario — Policy Undertaker">
          <div class="roster-avatar roster-avatar-darrius" aria-hidden="true"></div>
          <span class="roster-name">Dario</span>
          <span class="roster-role">Policy Undertaker</span>
        </a>
        <a href="/roster" class="roster-card" role="listitem" title="Demis — Quiet Solver">
          <div class="roster-avatar roster-avatar-demis" aria-hidden="true"></div>
          <span class="roster-name">Demis</span>
          <span class="roster-role">Quiet Solver</span>
        </a>
        <a href="/roster" class="roster-card" role="listitem" title="Mark — Sunlit Operator">
          <div class="roster-avatar roster-avatar-mark" aria-hidden="true"></div>
          <span class="roster-name">Mark</span>
          <span class="roster-role">Sunlit Operator</span>
        </a>
        <a href="/roster" class="roster-card" role="listitem" title="Jensen — Silicon Sovereign">
          <div class="roster-avatar roster-avatar-jensen" aria-hidden="true"></div>
          <span class="roster-name">Jensen</span>
          <span class="roster-role">Silicon Sovereign</span>
        </a>
        <a href="/roster" class="roster-card" role="listitem" title="Elon — Orbital Showman">
          <div class="roster-avatar roster-avatar-elon" aria-hidden="true"></div>
          <span class="roster-name">Elon</span>
          <span class="roster-role">Orbital Showman</span>
        </a>
      </div>

      <div class="duel-actions">
        <a href="/duel" class="btn-primary-duel">
          <span class="btn-text">Play Duel</span>
          <span class="btn-arrow" aria-hidden="true">▸</span>
        </a>
        <nav class="duel-nav-links" aria-label="Meta Duel shortcuts">
          <a href="/tune" class="duel-nav-btn">
            <span>Tune Fighters</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a href="/live" class="duel-nav-btn">
            <span>Watch Live</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
          <a href="/roster" class="duel-nav-btn">
            <span>Full Roster</span>
            <span class="link-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>
      </div>
    </section>

    <nav class="secondary-links" aria-label="Other simulations">
      <a href="/muzil/" class="secondary-dotted-link">Meta Muzil</a>
      <span class="secondary-dot" aria-hidden="true">·</span>
      <a href="/mandate-2038/" class="secondary-dotted-link">Mandate 2038</a>
    </nav>
  </main>
</body>
</html>
