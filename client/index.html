<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELF Arena — live spectator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2270%22>&#9876;</text></svg>">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="wrap">
    <header>
      <h1>SELF Arena <small id="status">— connecting…</small></h1>
      <div id="cycle"></div>
    </header>
    <canvas id="c" tabindex="0" width="1280" height="720"></canvas>
    <div id="bracket"></div>
    <div id="panels">
      <section class="panel">
        <h3>Now playing</h3>
        <div id="now"></div>
      </section>
      <section class="panel">
        <h3>Leaderboard</h3>
        <div id="leaderboard">loading…</div>
      </section>
      <section class="panel">
        <h3>Spec</h3>
        <p>Spectator view of <code>selfplay-arena</code>. A new bracket starts every minute. Eight configs compete single-elim; frames streamed via WebSocket, rendered locally.</p>
      </section>
    </div>
  </div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
